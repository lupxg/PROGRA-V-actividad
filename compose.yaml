x-app: &default-app
  build:
    context: .
    dockerfile: ./infrastructure/docker/Dockerfile
    target: final
  restart: unless-stopped
  secrets:
    - db_root_password
    - db_password
  env_file:
    - ".env"
  depends_on:
    db:
      condition: service_healthy
  networks:
    - backend


services:
  # ================================= DATABASE ============================
  db:
    image: mariadb:11.2
    restart: always
    secrets:
      - db_root_password
      - db_password
    volumes:
      - db-data:/var/lib/mysql
      - ./infrastructure/db/BDBiblioteca.sql:/docker-entrypoint-initdb.d/1.sql
    environment: 
      MARIADB_ROOT_PASSWORD_FILE: "${MARIADB_ROOT_PASSWORD_FILE}"
      MARIADB_PASSWORD_FILE: "${MARIADB_PASSWORD_FILE}"
      MARIADB_DATABASE: "${MARIADB_NAME}"
      MARIADB_USER: "${MARIADB_USER}"
    expose:
      - "${MARIADB_PORT:-3306}"
    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/healthcheck.sh",
          "--su-mysql",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
  
  # ============================= WEB ================================== 
  web:
    <<: *default-app
    ports:
      - "${PORT:-8000}:80"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/api/libros || exit 1"]
      interval: 60s
      timeout: 3s
      start_period: 5s
    networks:
      - frontend
      - backend

  # ============================= PHPMYADMIN ============================
  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
    networks:
      - backend
      - frontend


volumes:
  db-data:

secrets:
  db_password:
    file: ./infrastructure/db/password.txt
  db_root_password:
    file: ./infrastructure/db/root-password.txt

networks:
  frontend:
    driver: bridge
  backend:
    internal: true