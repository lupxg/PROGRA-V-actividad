<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Mis Préstamos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-custom shadow">

        <div class="container">

            <a class="navbar-brand" href="#">
                Biblioteca Virtual
            </a>

            <a href="index.html" class="btn btn-light btn-custom">
                Volver
            </a>

        </div>

    </nav>

    <div class="container mt-5">

        <!-- HERO -->
        <div class="hero-section">

            <div class="row align-items-center">

                <div class="col-md-8">

                    <h1 class="hero-title">
                        Mis Préstamos
                    </h1>
                </div>

                <div class="user-card mb-4 col-md-4 text-center">

                    <div class="card-body">
                        <p id="usuarioActual" class="mb-0 text-muted"></p>
                    </div>

                </div>
            </div>

        </div>

        <!-- USER INFO -->

        <!-- TABLE -->
        <div class="table-container">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h3 class="mb-0">
                    Historial de préstamos
                </h3>

                <input type="text" class="form-control w-25" placeholder="Buscar préstamo...">

            </div>

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">

                        <tr>
                            <th>ID</th>
                            <th>Libro ID</th>
                            <th>Fecha préstamo</th>
                            <th>Fecha devolución</th>
                            <th>Estado</th>
                        </tr>

                    </thead>

                    <tbody id="tablaPrestamos">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <!-- FOOTER -->
    <footer>
        Biblioteca Virtual © 2026
    </footer>

    <script src="js/prestamos.js"></script>

</body>

</html>
