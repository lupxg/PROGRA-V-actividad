<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">

</head>

<body class="auth-body">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-custom shadow">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                Biblioteca Virtual
            </a>

            <a href="index.html"
               class="btn btn-light btn-custom">
                Volver
            </a>

        </div>

    </nav>

    <!-- LOGIN CONTAINER -->
    <div class="container">

        <div class="row justify-content-center align-items-center auth-container mt-3">

            <div class="col-md-5 col-lg-4">

                <div class="auth-card">

                    <div class="text-center mb-4">

                        <h2 class="auth-title">
                            Iniciar sesión
                        </h2>

                    </div>

                    <form id="loginForm">

                        <div class="mb-3">

                            <label class="form-label">
                                Correo electrónico
                            </label>

                            <input type="email"
                                   class="form-control form-control-lg"
                                   id="correo"
                                   placeholder="correo@ejemplo.com"
                                   required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Contraseña
                            </label>

                            <input type="password"
                                   class="form-control form-control-lg"
                                   id="password"
                                   placeholder="********"
                                   required>

                        </div>

                        <div class="d-grid">

                            <button type="submit"
                                    class="btn btn-primary btn-lg">
                                Entrar
                            </button>

                        </div>

                    </form>

                    <div id="loginResult" class="mt-4"></div>

                    <hr class="my-4">

                    <div class="text-center">

                        <p class="mb-0 text-muted">
                            ¿No tienes cuenta?
                        </p>

                        <a href="register.html"
                           class="btn btn-outline-primary mt-3">
                            Crear cuenta
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
