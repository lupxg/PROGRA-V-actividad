<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Libros</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div class="container mt-5">

        <div class="d-flex justify-content-between mb-4">

            <h1>Libros</h1>

            <div>
                <a href="login.html" id="btnLogin" class="btn btn-success">
                    Login
                </a>
                <a href="prestamos.html" id="btnMisPrestamos" class="btn btn-secondary">
                    Mis Préstamos
                </a>
                <button id="btnLogout" class="btn btn-danger" onclick="logout()">
                    Logout
                </button>
            </div>
        </div>

        <table class="table table-bordered table-hover">

            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Titulo</th>
                    <th>Autor</th>
                    <th>Stock</th>
                    <th>Disponible</th>
                    <th>Imagen</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody id="tablaLibros"></tbody>

        </table>

    </div>


    <!-- MODAL PRESTAMO -->

    <div class="modal fade" id="prestamoModal" tabindex="-1">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Registrar préstamo
                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <form id="formPrestamo">

                        <input type="hidden" id="libro_id">

                        <div class="mb-3">

                            <label class="form-label">
                                Usuario
                            </label>

                            <input type="text" class="form-control" id="usuario_nombre" readonly>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Fecha devolución
                            </label>

                            <input type="date" class="form-control" id="fecha_devolucion" required>

                        </div>

                        <button type="submit" class="btn btn-primary">
                            Confirmar préstamo
                        </button>

                    </form>

                    <div id="resultadoPrestamo" class="mt-3"></div>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/libros.js"></script>

</body>

</html>
