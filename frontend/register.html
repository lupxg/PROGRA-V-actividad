<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header">
                    <h3 class="mb-0">
                        Registro de Usuario
                    </h3>
                </div>

                <div class="card-body">

                    <form id="registerForm">

                        <div class="mb-3">

                            <label class="form-label">
                                Nombre
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="nombre"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Correo Electrónico
                            </label>

                            <input type="email"
                                   class="form-control"
                                   id="correo"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Contraseña
                            </label>

                            <input type="password"
                                   class="form-control"
                                   id="password"
                                   required>

                        </div>

                        <button type="submit"
                                class="btn btn-primary w-100">

                            Registrarse

                        </button>

                    </form>

                    <div id="resultado"
                         class="mt-4"></div>

                    <div class="mt-3 text-center">

                        <a href="login.html">
                            ¿Ya tienes cuenta? Inicia sesión
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="js/register.js"></script>

</body>
</html>
