<VirtualHost *:80>

    DocumentRoot /var/www/html/frontend

    <Directory /var/www/html/frontend>
        AllowOverride All
        Require all granted
    </Directory>

    Alias /api/ /var/www/html/ApiBiblioteca/

    <Directory /var/www/html/ApiBiblioteca/>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

</VirtualHost>