<VirtualHost *:80>

    # Frontend folder.
    DocumentRoot /var/www/html/frontend

    <Directory /var/www/html/frontend>
        AllowOverride All
        Require all granted
    </Directory>

    # Backend API.
    Alias /api/ /var/www/html/ApiBiblioteca/

    <Directory /var/www/html/ApiBiblioteca/>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>